<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Act | Actually Social Media</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --accent: #007AFF; /* iOS Blue */
            --grey: #f2f2f7;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            overflow: hidden; 
            height: 100vh;
        }

        /* Views System */
        .view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            padding: var(--safe-top) 20px var(--safe-bottom);
        }
        .view.active { display: flex; }

        /* 1. Splash Screen */
        #splash-view { 
            justify-content: center; 
            align-items: center; 
            background: #fff;
            z-index: 100;
        }
        .logo-group { text-align: center; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .logo-group h1 { font-size: 80px; font-weight: 800; letter-spacing: -3px; line-height: 0.9; }
        .logo-group p { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #666; margin-top: 10px; }

        /* 2. Login View */
        #login-view { justify-content: center; align-items: center; text-align: center; }
        .face-id-prompt { 
            width: 80px; height: 80px; 
            border: 2px solid var(--text); 
            border-radius: 20px; 
            margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .btn {
            width: 100%; padding: 18px; 
            border-radius: 14px; border: none;
            font-weight: 700; font-size: 16px; margin-bottom: 12px;
            cursor: pointer;
        }
        .btn-black { background: var(--text); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #ddd; }

        /* 3. Main Interface */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around;
            padding: 15px 0 calc(15px + var(--safe-bottom));
            border-top: 0.5px solid #ddd;
        }
        .nav-item { font-size: 12px; font-weight: 700; color: #999; text-transform: uppercase; }
        .nav-item.active { color: var(--text); }

        header { 
            padding: 20px 0; 
            display: flex; justify-content: space-between; align-items: flex-end; 
        }
        header h2 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }

        /* Feed */
        .content-scroll { overflow-y: scroll; padding-bottom: 100px; }
        .post { margin-bottom: 30px; }
        .post-img { 
            width: 100%; aspect-ratio: 4/5; 
            background: #eee; border-radius: 2px; 
            object-fit: cover;
        }
        .post-meta { margin-top: 10px; font-size: 14px; }
        .post-meta b { font-weight: 800; margin-right: 8px; }

        /* Add Friend View */
        #camera-preview {
            width: 100%; aspect-ratio: 1/1; 
            background: #000; border-radius: 24px;
            position: relative; overflow: hidden;
            margin-top: 20px;
        }
        .qr-code {
            width: 180px; height: 180px;
            background: #fff; margin: 40px auto;
            border: 10px solid #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .timer { font-family: 'JetBrains Mono'; color: var(--accent); font-size: 24px; text-align: center; }

        /* Animations */
        .fade-out { opacity: 0; transform: scale(0.9); pointer-events: none; }
    </style>
</head>
<body>

    <div id="splash-view" class="view active">
        <div class="logo-group" id="splash-logo">
            <h1>Act</h1>
            <p>Actually Social Media</p>
        </div>
    </div>

    <div id="login-view" class="view">
        <div class="face-id-prompt" onclick="fakeFaceID()">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3M8 7v10M16 7v10M12 8v5m0 3h.01"/></svg>
        </div>
        <h3 style="margin-bottom: 40px;">Verifying Presence...</h3>
        <button class="btn btn-black" onclick="fakeFaceID()">Login with Face ID</button>
        <button class="btn btn-outline" onclick="fakeFaceID()">Continue with Apple</button>
        <button class="btn btn-outline" onclick="fakeFaceID()">Continue with Google</button>
    </div>

    <div id="feed-view" class="view">
        <header>
            <h2>Presence</h2>
            <div style="font-family: 'JetBrains Mono'; font-size: 12px;">PTA, ZA</div>
        </header>
        <div class="content-scroll" id="feed-items">
            </div>
    </div>

    <div id="add-view" class="view">
        <header><h2>Handshake</h2></header>
        <div id="camera-preview">
            <video id="video" width="100%" height="100%" autoplay playsinline style="object-fit: cover;"></video>
        </div>
        <div class="qr-code" onclick="simulateScan()">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ActUser_402" alt="QR">
        </div>
        <div class="timer" id="countdown">05.00s</div>
        <p style="text-align: center; font-size: 12px; margin-top: 10px; opacity: 0.5;">SCAN TO CONNECT</p>
    </div>

    <div id="account-view" class="view">
        <header><h2>Circle</h2></header>
        <div class="content-scroll">
            <div id="friends-list"></div>
        </div>
    </div>

    <nav class="nav-bar" id="main-nav" style="display: none;">
        <div class="nav-item active" onclick="showView('feed-view')">Feed</div>
        <div class="nav-item" onclick="showView('add-view')">Add</div>
        <div class="nav-item" onclick="showView('account-view')">Circle</div>
    </nav>

    <script>
        // Demo Data
        const posts = [
            { user: 'S. Mc Duck', loc: 'London', img: 'https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=800' },
            { user: 'Hannah N.', loc: 'Plett', img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800' },
            { user: 'Alex S.', loc: 'Pretoria', img: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800' }
        ];

        const friends = ["Spludge Mc Duck", "Hannah New", "Stewart Steven", "Paige S."];

        // Navigation Logic
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            // Update Nav UI
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.innerText.toLowerCase() === viewId.split('-')[0]);
            });

            if(viewId === 'add-view') startCamera();
            else stopCamera();
        }

        // 1. Initial Transition
        setTimeout(() => {
            document.getElementById('splash-logo').classList.add('fade-out');
            setTimeout(() => {
                showView('login-view');
            }, 800);
        }, 2500);

        // 2. Fake FaceID
        function fakeFaceID() {
            const prompt = document.querySelector('.face-id-prompt');
            prompt.style.borderColor = 'var(--accent)';
            prompt.style.color = 'var(--accent)';
            
            setTimeout(() => {
                document.getElementById('main-nav').style.display = 'flex';
                loadFeed();
                showView('feed-view');
            }, 1000);
        }

        // 3. Load Feed
        function loadFeed() {
            const container = document.getElementById('feed-items');
            container.innerHTML = posts.map(p => `
                <div class="post">
                    <img class="post-img" src="${p.img}">
                    <div class="post-meta"><b>${p.user}</b> • ${p.loc}</div>
                </div>
            `).join('');

            const friendsContainer = document.getElementById('friends-list');
            friendsContainer.innerHTML = friends.map(f => `
                <div style="padding: 20px 0; border-bottom: 0.5px solid #eee; display:flex; justify-content: space-between;">
                    <b>${f}</b>
                    <span style="color:var(--accent); font-size:12px;">CONNECTED</span>
                </div>
            `).join('');
        }

        // 4. Camera & Handshake Logic
        let stream = null;
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video').srcObject = stream;
                startCountdown();
            } catch (e) { console.log("Camera error"); }
        }

        function stopCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
        }

        function startCountdown() {
            let sec = 5;
            const timerEl = document.getElementById('countdown');
            const interval = setInterval(() => {
                sec -= 0.01;
                timerEl.innerText = sec.toFixed(2) + "s";
                if(sec <= 0) {
                    clearInterval(interval);
                    timerEl.innerText = "REFRESH QR";
                }
            }, 10);
        }

        function simulateScan() {
            const videoContainer = document.getElementById('camera-preview');
            videoContainer.style.border = '4px solid var(--accent)';
            setTimeout(() => {
                alert("Handshake Complete. Friend Added.");
                showView('feed-view');
            }, 500);
        }
    </script>
</body>
</html>
