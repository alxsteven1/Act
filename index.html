<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Act | Actually Social Media</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff; --text: #000000; --accent: #007AFF;
            --grey: #f2f2f7; --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* Navigation & View System */
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; background: white; z-index: 10; }
        .view.active { display: flex; }
        .scroll { overflow-y: auto; padding: calc(var(--safe-top) + 20px) 20px 120px; }
        
        header { padding: 15px 20px; border-bottom: 0.5px solid #eee; display: flex; justify-content: space-between; align-items: center; padding-top: var(--safe-top); }
        header h2 { font-weight: 800; font-size: 24px; letter-spacing: -1px; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 0.5px solid #eee; display: flex; justify-content: space-around; padding: 10px 5px calc(5px + var(--safe-bottom)); z-index: 100; }
        .nav-item { font-size: 8px; font-weight: 700; color: #bbb; text-transform: uppercase; text-align: center; flex: 1; }
        .nav-item.active { color: #000; }
        .nav-icon { width: 22px; height: 22px; margin: 0 auto 2px; stroke-width: 2; }

        /* Components */
        .pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-black { background: #000; color: #fff; }

        /* Feed & Profile Overlay */
        .post { margin-bottom: 30px; }
        .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; background: #fafafa; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
        .grid-item { aspect-ratio: 1/1; background: #eee; object-fit: cover; width: 100%; }

        /* Chat & Messages */
        .msg-row { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 0.5px solid #f0f0f0; }
        #chat-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; transform: translateX(100%); transition: 0.3s; z-index: 200; }
        #chat-view.open { transform: translateX(0); }
        .chat-bubble { padding: 12px 16px; border-radius: 20px; max-width: 80%; margin-bottom: 10px; font-size: 14px; }
        .msg-them { background: var(--grey); align-self: flex-start; }
        .msg-me { background: var(--accent); color: white; align-self: flex-end; }

        /* Add Friends (The Handshake) */
        .camera-square { width: 240px; height: 240px; background: #000; border-radius: 40px; overflow: hidden; margin: 20px auto; position: relative; border: 4px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .qr-swap-box { background: #fff; padding: 15px; border-radius: 20px; width: 180px; height: 180px; margin: 20px auto; display: flex; align-items: center; justify-content: center; }
        #qr-timer-bar { width: 100%; height: 4px; background: #eee; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        #qr-progress { width: 0%; height: 100%; background: var(--accent); }

        /* Post Creation */
        .shutter-btn { width: 70px; height: 70px; border-radius: 50%; border: 5px solid #eee; margin: 40px auto; }

        /* Profile Overlays */
        #profile-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; transform: translateY(100%); transition: 0.4s; z-index: 500; }
        #profile-overlay.open { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="view-auth" class="view active" style="justify-content:center; align-items:center; padding:40px;">
        <h1 style="font-size:60px; font-weight:800; margin-bottom:40px;">Act.</h1>
        <div id="face-box" style="width:100px; height:100px; border:2px solid #000; border-radius:30px; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3M8 7v10M16 7v10M12 8v5m0 3h.01"/></svg>
        </div>
        <button class="btn btn-black" onclick="simulateLogin()">Face ID Login</button>
        <button class="btn" style="background:#fff; border:1px solid #ddd;" onclick="simulateLogin()">Sign Up</button>
    </div>

    <div id="view-feed" class="view"><header><h2>Presence</h2></header><div class="scroll" id="feed-items"></div></div>

    <div id="view-messages" class="view">
        <header><h2>Messages</h2></header>
        <div class="scroll" id="msg-list"></div>
    </div>

    <div id="view-post" class="view" style="background:#000; color:white;">
        <header style="border:none;"><h2>Capture</h2><span onclick="showView('view-feed')">Cancel</span></header>
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
            <div style="width:100%; aspect-ratio:1/1; background:#111;">
                <video id="post-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
            </div>
            <div class="shutter-btn" onclick="alert('Post Shared Actually.')"></div>
        </div>
    </div>

    <div id="view-add" class="view" style="background:#fcfcfc;">
        <header><h2>Handshake</h2></header>
        <div class="scroll" style="text-align:center;">
            <div class="camera-square">
                <video id="add-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
            </div>
            <div class="qr-swap-box" onclick="simulateScan()">
                <img id="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=A" style="width:100%;">
            </div>
            <div id="qr-timer-bar"><div id="qr-progress"></div></div>
            <p style="font-size:12px; margin-top:15px; opacity:0.4;">SWAPPING ENCRYPTION KEY...</p>
        </div>
    </div>

    <div id="view-circle" class="view"><header><h2>Circle</h2></header><div class="scroll" id="circle-list"></div></div>

    <div id="view-account" class="view">
        <header><h2>My Account</h2></header>
        <div class="scroll">
            <div style="text-align:center; padding:20px 0;">
                <img src="assets/pfp_alex.png" class="pfp" style="width:80px; height:80px;" onerror="this.src='https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200'">
                <h3 style="margin-top:10px;">Alex Steven</h3>
                <div style="display:flex; justify-content:center; gap:20px; margin-top:15px; font-size:14px;">
                    <div><b>12</b><p style="opacity:0.5;">Posts</p></div>
                    <div><b>4</b><p style="opacity:0.5;">Friends</p></div>
                </div>
            </div>
            <div class="grid" id="my-grid"></div>
        </div>
    </div>

    <div id="chat-view">
        <header><span onclick="closeChat()">Back</span><h2 id="chat-name">Chat</h2><span></span></header>
        <div class="scroll" style="display:flex; flex-direction:column;" id="chat-msgs"></div>
    </div>

    <div id="profile-overlay">
        <header><span onclick="closeProfile()">Back</span><h2 id="prof-name">Profile</h2><span></span></header>
        <div class="scroll" id="prof-content"></div>
    </div>

    <nav class="nav-bar" id="bottom-nav" style="display:none;">
        <div class="nav-item active" onclick="showView('view-feed')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Feed</div>
        <div class="nav-item" onclick="showView('view-messages')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Msgs</div>
        <div class="nav-item" onclick="showView('view-post')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>Post</div>
        <div class="nav-item" onclick="showView('view-add')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>Add</div>
        <div class="nav-item" onclick="showView('view-circle')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>Circle</div>
        <div class="nav-item" onclick="showView('view-account')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Acc</div>
    </nav>

    <script>
        const users = {
            hannah: { name: "Hannah", city: "London UK", pfp: "assets/pfp_hannah.png", alt: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200", bio: "Actually exploring.", lastMsg: "See you in London!", posts: 3 },
            paige: { name: "Paige", city: "Pretoria", pfp: "assets/pfp_paige.png", alt: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200", bio: "Tuks Student", lastMsg: "Did you finish the app?", posts: 1 },
            kyle: { name: "Kyle", city: "Johannesburg", pfp: "assets/pfp_kyle.png", alt: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200", bio: "Work hard. Act fast.", lastMsg: "Join the game later?", posts: 5 },
            spludge: { name: "Spludge", city: "Pretoria", pfp: "assets/pfp_spludge.png", alt: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200", bio: "Anti-Algorithm.", lastMsg: "Send that link.", posts: 2 }
        };

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => {
                i.classList.toggle('active', id.includes(i.innerText.toLowerCase()));
            });
            if(id === 'view-post' || id === 'view-add') startCamera(id === 'view-post' ? 'post-video' : 'add-video');
            else stopCamera();
            if(id === 'view-feed') renderFeed();
            if(id === 'view-messages') renderMessages();
            if(id === 'view-circle') renderCircle();
            if(id === 'view-account') renderAccount();
        }

        // Camera Logic
        let currentStream = null;
        async function startCamera(videoId) {
            if(currentStream) stopCamera();
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            document.getElementById(videoId).srcObject = currentStream;
        }
        function stopCamera() {
            if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        }

        // QR Swapping Logic
        let qrState = 0;
        setInterval(() => {
            qrState = qrState === 0 ? 1 : 0;
            document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${qrState === 0 ? 'ACT_KEY_A' : 'ACT_KEY_B'}`;
            let prog = document.getElementById('qr-progress');
            prog.style.transition = 'none'; prog.style.width = '0%';
            setTimeout(() => { prog.style.transition = '5s linear'; prog.style.width = '100%'; }, 50);
        }, 5000);

        function simulateLogin() {
            document.getElementById('bottom-nav').style.display = 'flex';
            showView('view-feed');
        }

        function renderMessages() {
            const list = document.getElementById('msg-list');
            list.innerHTML = Object.entries(users).map(([id, u]) => `
                <div class="msg-row" onclick="openChat('${id}')">
                    <img src="${u.pfp}" onerror="this.src='${u.alt}'" class="pfp">
                    <div style="flex:1;"><b>${u.name}</b><p style="font-size:12px; opacity:0.5;">${u.lastMsg}</p></div>
                </div>
            `).join('');
        }

        function openChat(id) {
            const u = users[id];
            document.getElementById('chat-name').innerText = u.name;
            document.getElementById('chat-msgs').innerHTML = `
                <div class="chat-bubble msg-them">Yo Alex! ${u.lastMsg}</div>
                <div class="chat-bubble msg-me">Actually just testing the app right now.</div>
            `;
            document.getElementById('chat-view').classList.add('open');
        }
        function closeChat() { document.getElementById('chat-view').classList.remove('open'); }

        function renderCircle() {
            const list = document.getElementById('circle-list');
            const groups = {};
            Object.values(users).forEach(u => { if(!groups[u.city]) groups[u.city] = []; groups[u.city].push(u); });
            list.innerHTML = Object.keys(groups).map(city => `
                <div style="margin-top:20px;">
                    <div style="font-size:10px; font-weight:800; color:#999; text-transform:uppercase; margin-bottom:10px;">${city}</div>
                    ${groups[city].map(u => `
                        <div class="msg-row" style="border:none;">
                            <img src="${u.pfp}" onerror="this.src='${u.alt}'" class="pfp" style="width:35px; height:35px;">
                            <b>${u.name}</b>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function renderFeed() {
            const container = document.getElementById('feed-items');
            container.innerHTML = Object.values(users).map(u => `
                <div class="post">
                    <div class="msg-row" style="border:none; padding:10px 0;">
                        <img src="${u.pfp}" onerror="this.src='${u.alt}'" class="pfp" style="width:30px; height:30px;">
                        <b>${u.name}</b>
                    </div>
                    <img src="https://picsum.photos/600/600?random=${u.name}" class="post-img">
                    <p style="font-size:12px; margin-top:8px;"><b>${u.name}</b> was here. <span style="color:#999;">2h ago</span></p>
                </div>
            `).join('');
        }

        function renderAccount() {
            const grid = document.getElementById('my-grid');
            grid.innerHTML = Array(9).fill(0).map((_, i) => `<img class="grid-item" src="https://picsum.photos/300/300?random=alex${i}">`).join('');
        }

        function simulateScan() {
            alert("New Friend Found: Kyle from Johannesburg");
            showView('view-circle');
        }

        // Init
        renderFeed();
    </script>
</body>
</html>
