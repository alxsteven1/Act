
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Act | Actually Social Media</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> </head>
<body>

    <div id="view-messages" class="view active">
        <header><h2>Messages</h2></header>
        <div class="scroll" id="msg-list"></div>
    </div>

    <div id="chat-view">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;" onclick="closeChat()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                <b id="chat-name">Name</b>
            </div>
        </header>
        <div class="chat-area" id="chat-history">
            <div class="bubble them">Hey! Are we still on for later?</div>
            <div class="bubble me">Yeah definitely, just finishing up this code.</div>
        </div>
        <div class="chat-input">
            <input type="text" placeholder="Message...">
            <button style="background:var(--accent); color:white; border:none; padding:0 20px; border-radius:24px; font-weight:bold;">Send</button>
        </div>
    </div>

    <div id="view-post" class="view">
        <header style="background: transparent; color: white; border: none; position: absolute; width: 100%;">
            <h2>Capture</h2>
        </header>
        <div class="camera-container">
            <video id="post-camera-stream" autoplay playsinline></video>
            <div class="camera-controls">
                <div class="flip-btn" onclick="flipCamera()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                </div>
                <div class="capture-btn" onclick="takePhoto()"></div>
                <div style="width: 44px;"></div> </div>
            <canvas id="photo-canvas" style="display:none;"></canvas> 
        </div>
    </div>

    <div id="view-post-details" class="view">
        <header>
            <span onclick="showView('view-post')" style="color:var(--accent); font-weight:600;">Retake</span>
            <h2>New Post</h2>
            <span style="width: 50px;"></span>
        </header>
        <div class="scroll">
            <img id="preview-image" class="preview-img" src="">
            <input type="text" id="post-location" class="input-field" placeholder="Add Location (e.g., Pretoria)">
            <textarea id="post-caption" class="input-field" placeholder="Write a caption..." rows="3"></textarea>
            <button class="btn" onclick="publishPost()">Share</button>
        </div>
    </div>

    <div id="view-add" class="view">
        <header><h2>Handshake</h2></header>
        <div class="scroll" style="padding: 0 20px;">
            <div class="camera-square" onclick="simulateScan()">
                <video id="add-camera-stream" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                <div style="position:absolute; bottom:10px; width:100%; text-align:center; font-size:12px; color:rgba(255,255,255,0.5);">TAP TO SCAN</div>
            </div>
            <div class="qr-section">
                <div class="qr-box">
                    <img id="dynamic-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=act_alex_v1">
                </div>
                <div id="timer-text">05.00s</div>
            </div>
        </div>
    </div>

    <div id="view-feed" class="view">
        <header><h2>Presence</h2></header>
        <div class="scroll" id="feed-container"></div>
    </div>

    <div id="view-account" class="view">
         <header><h2></h2></header>
         <header><h2></h2></header>
        <header><h2>My Account</h2></header>
        <div class="scroll">
            <div class="profile-header">
                <img id="my-pfp" src="">
                <h2 id="my-name">Alex</h2>
                <p id="my-bio" style="font-size: 14px; color: #666; margin-top: 5px;">Bio</p>
                <div class="stats">
                    <div><b id="stat-friends">0</b> Friends</div>
                    <div><b id="stat-posts">0</b> Posts</div>
                </div>
            </div>
            <div class="section-title">My Posts</div>
            <div class="grid" id="my-grid"></div>
            
            <div class="section-title" style="margin-top: 40px;">My Circle</div>
            <div id="my-circle-container"></div>
        </div>
    </div>

    <div id="profile-overlay">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;" onclick="closeProfile()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                <b>Back</b>
            </div>
        </header>
        <div class="scroll">
            <div class="profile-header">
                <img id="other-pfp" src="">
                <h2 id="other-name">Name</h2>
                <p id="other-bio" style="font-size: 14px; color: #666; margin-top: 5px;"></p>
            </div>
            <div class="section-title">Posts</div>
            <div class="grid" id="other-grid"></div>
        </div>
    </div>

    <div id="scan-popup" onclick="this.classList.remove('show')">
        <h3 style="margin-bottom: 5px;">Connection Successful!</h3>
        <p id="popup-text" style="font-size: 14px; opacity: 0.8;"></p>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showView('view-messages')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="nav-item" onclick="showView('view-post')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
        <div class="nav-item" onclick="showView('view-add')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </div>
        <div class="nav-item" onclick="showView('view-feed')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </div>
        <div class="nav-item" onclick="showView('view-account')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2" ry="2"/><path d="M8 18v-2a4 4 0 0 1 8 0v2"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
    </nav>

    <script>
        // DATA
        const users = {
            alex: { id: 'alex', name: "Alex Matthew", city: "Pretoria", bio: "Building Act.", pfp: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200", posts: [{img: "https://picsum.photos/400/400?random=a1", loc:"Pretoria", cap:"First post"}] },
            hannah: { id: 'hannah', name: "Hannah", city: "London UK", bio: "Coffee & Travel", pfp: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200", lastMsg: "See you later!", posts: [{img: "https://picsum.photos/400/400?random=h1", loc:"London", cap:"Vibes"}] },
            paige: { id: 'paige', name: "Paige", city: "Pretoria", bio: "Tuks Student", pfp: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200", lastMsg: "Did you check the assignment?", posts: [{img: "https://picsum.photos/400/400?random=p1", loc:"Campus", cap:"Studying"}] },
            spludge: { id: 'spludge', name: "S. Mc Duck", city: "London UK", bio: "Vibes only", pfp: "https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=200", lastMsg: "Bro the game last night...", posts: [{img: "https://picsum.photos/400/400?random=s1", loc:"Pub", cap:"Match day"}] },
            kyle: { id: 'kyle', name: "Kyle", city: "Johannesburg", bio: "Tech & Fitness", pfp: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200", lastMsg: "", posts: [{img: "https://picsum.photos/400/400?random=k1", loc:"Gym", cap:"Grind"}] }
        };

        let myCircle = ['hannah', 'paige', 'spludge']; 
        let currentFacingMode = "environment";
        let localStream = null;
        let lastTapTime = 0;
        
        // INITIALIZE APP
        document.addEventListener("DOMContentLoaded", () => {
            renderMessages(); renderFeed(); renderAccount(); startQRLoop();
        });

        // VIEW NAVIGATION
        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // Update Icon Nav
            document.querySelectorAll('.nav-item').forEach((item, index) => {
                const views = ['view-messages', 'view-post', 'view-add', 'view-feed', 'view-account'];
                item.classList.toggle('active', views[index] === id);
            });
            
            // Camera Routing
            if(localStream) { localStream.getTracks().forEach(track => track.stop()); }
            if(id === 'view-post') setupCamera('post-camera-stream');
            if(id === 'view-add') setupCamera('add-camera-stream');

            if(id === 'view-account') renderAccount();
            if(id === 'view-feed') renderFeed();
        }

        // --- MESSAGES ---
        function renderMessages() {
            document.getElementById('msg-list').innerHTML = myCircle.map(id => `
                <div class="friend-row" onclick="openChat('${id}')">
                    <img src="${users[id].pfp}" class="pfp">
                    <div style="flex: 1;">
                        <div style="display:flex; justify-content:space-between;">
                            <b>${users[id].name}</b><span style="font-size:12px; color:#ccc;">2h</span>
                        </div>
                        <div class="msg-preview">${users[id].lastMsg}</div>
                    </div>
                </div>
            `).join('');
        }
        function openChat(id) {
            document.getElementById('chat-name').innerText = users[id].name;
            document.getElementById('chat-view').classList.add('open');
        }
        function closeChat() { document.getElementById('chat-view').classList.remove('open'); }

        // --- CAMERA & POSTING FLOW ---
        async function setupCamera(videoId) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
                document.getElementById(videoId).srcObject = localStream;
            } catch (e) { console.log("Camera access blocked. Using blank view."); }
        }

        function flipCamera() {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            setupCamera('post-camera-stream');
        }

        function takePhoto() {
            const video = document.getElementById('post-camera-stream');
            const canvas = document.getElementById('photo-canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Go to Details Page
            document.getElementById('preview-image').src = canvas.toDataURL('image/png');
            document.getElementById('view-post').classList.remove('active');
            document.getElementById('view-post-details').classList.add('active');
        }

        function publishPost() {
            const imgSrc = document.getElementById('preview-image').src;
            const loc = document.getElementById('post-location').value || "Unknown Location";
            const cap = document.getElementById('post-caption').value;
            
            users.alex.posts.unshift({img: imgSrc, loc: loc, cap: cap}); // Add to front
            document.getElementById('post-location').value = "";
            document.getElementById('post-caption').value = "";
            
            showView('view-feed');
        }

        // --- ADD FRIEND ---
        function startQRLoop() {
            let timeLeft = 500; let qrToggle = false;
            setInterval(() => {
                timeLeft -= 1;
                document.getElementById('timer-text').innerText = (timeLeft / 100).toFixed(2) + "s";
                if(timeLeft <= 0) {
                    timeLeft = 500; qrToggle = !qrToggle;
                    document.getElementById('dynamic-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=act_alex_${qrToggle ? '1':'2'}`;
                }
            }, 10);
        }
        function simulateScan() {
            if(!myCircle.includes('kyle')) {
                myCircle.push('kyle');
                document.getElementById('popup-text').innerText = `You are now connected with ${users.kyle.name}.`;
                document.getElementById('scan-popup').classList.add('show');
                renderMessages(); renderAccount();
                setTimeout(() => document.getElementById('scan-popup').classList.remove('show'), 3000);
            }
        }

        // --- FEED & PROFILE OVERLAYS ---
        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = "";
            
            // Combine all posts from circle + self
            let allPosts = [];
            [...myCircle, 'alex'].forEach(id => {
                users[id].posts.forEach((post, i) => {
                    allPosts.push({ user: users[id], post: post, age: i + 1 });
                });
            });

            allPosts.forEach(data => {
                container.innerHTML += `
                    <div class="post">
                        <div class="post-header" onclick="openProfile('${data.user.id}')">
                            <img src="${data.user.pfp}" class="pfp" style="width:30px; height:30px;">
                            <b>${data.user.name}</b>
                        </div>
                        <div style="position:relative;">
                            <img src="${data.post.img}" class="post-img" onclick="handleImageTap('${data.user.id}', this)">
                            <div class="heart-anim">🤍</div>
                        </div>
                        <div class="post-time"><b>${data.user.name}</b> ${data.post.cap}</div>
                        <div class="post-time" style="margin-top:2px; font-size:10px;">${data.age}h ago in ${data.post.loc}</div>
                    </div>
                `;
            });
        }

        // Tap = Profile, Double Tap = Like
        function handleImageTap(userId, imgElement) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            
            if (tapLength < 300 && tapLength > 0) {
                // Double tap
                const heart = imgElement.nextElementSibling;
                heart.classList.add('show');
                setTimeout(() => heart.classList.remove('show'), 800);
            } else {
                // Single tap - wait briefly to see if it becomes a double tap
                setTimeout(() => {
                    if(new Date().getTime() - lastTapTime >= 300) { openProfile(userId); }
                }, 300);
            }
            lastTapTime = currentTime;
        }

        function openProfile(id) {
            const u = users[id];
            document.getElementById('other-name').innerText = u.name;
            document.getElementById('other-bio').innerText = u.bio;
            document.getElementById('other-pfp').src = u.pfp;
            document.getElementById('other-grid').innerHTML = u.posts.map(p => `<img src="${p.img}">`).join('');
            document.getElementById('profile-overlay').classList.add('open');
        }
        function closeProfile() { document.getElementById('profile-overlay').classList.remove('open'); }

        // --- ACCOUNT ---
        function renderAccount() {
            const me = users.alex;
            document.getElementById('my-pfp').src = me.pfp;
            document.getElementById('my-name').innerText = me.name;
            document.getElementById('my-bio').innerText = me.bio;
            document.getElementById('stat-friends').innerText = myCircle.length;
            document.getElementById('stat-posts').innerText = me.posts.length;
            document.getElementById('my-grid').innerHTML = me.posts.map(p => `<img src="${p.img}">`).join('');

            // Circle Grouping
            const circleContainer = document.getElementById('my-circle-container');
            const groups = {};
            myCircle.forEach(id => {
                const city = users[id].city;
                if(!groups[city]) groups[city] = [];
                groups[city].push(users[id]);
            });

            circleContainer.innerHTML = Object.keys(groups).map(city => `
                <div style="margin-bottom: 20px;">
                    <div style="font-size:12px; font-weight:bold; color:#aaa; margin-bottom:10px;">${city.toUpperCase()}</div>
                    ${groups[city].map(f => `
                        <div class="friend-row" style="padding: 10px 0;" onclick="showView('view-messages'); openChat('${f.id}')">
                            <img src="${f.pfp}" class="pfp" style="width:35px; height:35px;">
                            <b>${f.name}</b>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
